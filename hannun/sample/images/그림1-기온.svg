<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, Helvetica, sans-serif">
  <!-- 랜딩 샘플용 가상 자료. 언어와 무관하게 쓰도록 축 글자는 숫자만 둔다 -->
  <rect width="640" height="300" fill="#ffffff"/>
  <g stroke="#d1d9e0" stroke-width="1">
    <line x1="60" y1="40" x2="620" y2="40"/><line x1="60" y1="100" x2="620" y2="100"/>
    <line x1="60" y1="160" x2="620" y2="160"/><line x1="60" y1="220" x2="620" y2="220"/>
    <line x1="60" y1="260" x2="620" y2="260" stroke="#8c959f"/>
  </g>
  <g fill="#57606a" font-size="13" text-anchor="end">
    <text x="50" y="44">34</text><text x="50" y="104">31</text><text x="50" y="164">28</text><text x="50" y="224">25</text>
  </g>
  <g fill="#57606a" font-size="13" text-anchor="middle">
    <text x="100" y="282">6</text><text x="180" y="282">8</text><text x="260" y="282">10</text><text x="340" y="282">12</text>
    <text x="420" y="282">14</text><text x="500" y="282">16</text><text x="580" y="282">18</text>
  </g>
  <polyline fill="none" stroke="#cf222e" stroke-width="3" stroke-linejoin="round"
    points="100,210 180,170 260,120 340,72 420,52 500,70 580,118"/>
  <polyline fill="none" stroke="#1a7f37" stroke-width="3" stroke-linejoin="round"
    points="100,222 180,196 260,160 340,122 420,108 500,124 580,158"/>
</svg>
